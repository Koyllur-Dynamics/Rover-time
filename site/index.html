<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rover-time</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091117;color:#e6edf3;font:16px system-ui}#unity-canvas{width:100%;height:100%;display:block}#loading{position:absolute;inset:0;display:grid;place-content:center;gap:1rem;text-align:center;padding:2rem}
#loading-art{width:min(560px,80vw);max-height:66vh;object-fit:contain;justify-self:center}#status{font-size:20px;color:#5ce8bb}progress{accent-color:#27d8b3;width:min(28rem,80vw);height:1rem;margin:auto}button{background:#37bac8;color:#071117;border:0;border-radius:6px;padding:.6rem 1rem;cursor:pointer}#fullscreen{position:fixed;left:50%;transform:translateX(-50%);bottom:8px;opacity:.7}#error{max-width:50rem;white-space:pre-wrap}</style></head>
<body><canvas id="unity-canvas" tabindex="-1"></canvas><div id="loading"><img id="loading-art" src="rover-time-loading.gif" alt="Rover-time loading animation"><span id="status">Loading Rover-time…</span><progress id="progress" max="1" value="0"></progress><span id="error"></span></div><button id="fullscreen" aria-label="Full screen">⛶</button>
<script src="rover-config.js"></script>
<script>
const canvas=document.getElementById('unity-canvas'),loading=document.getElementById('loading');let game;
const config={dataUrl:'Build/Web.data.unityweb',frameworkUrl:'Build/Web.framework.js.unityweb',codeUrl:'Build/Web.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'DefaultCompany',productName:'Rover-time',productVersion:'0.1.0',autoSyncPersistentDataPath:false,showBanner:(message,type)=>{if(type==='error'){loading.style.display='grid';document.getElementById('error').textContent=message;}}};
const script=document.createElement('script');script.src='Build/Web.loader.js';script.onload=()=>createUnityInstance(canvas,config,value=>document.getElementById('progress').value=value).then(instance=>{game=instance;loading.style.display='none';canvas.focus();}).catch(error=>{document.getElementById('status').textContent='Rover-time could not start';document.getElementById('error').textContent=String(error);});script.onerror=()=>document.getElementById('error').textContent='The simulator could not download. Please reload the page.';document.body.appendChild(script);
document.getElementById('fullscreen').onclick=()=>game?.SetFullscreen(1);
window.RoverWebExit=async()=>{window.roverUnsaved=false;if(game)await game.Quit();game=null;canvas.style.display='none';document.getElementById('fullscreen').hidden=true;loading.style.display='grid';document.getElementById('status').textContent='Rover-time is closed.';document.getElementById('progress').hidden=true;const reopen=document.createElement('button');reopen.textContent='Open again';reopen.onclick=()=>location.reload();loading.appendChild(reopen);};
window.addEventListener('beforeunload',event=>{if(window.roverUnsaved){event.preventDefault();event.returnValue='';}});
</script></body></html>
